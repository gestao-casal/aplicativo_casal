<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listas de Compras</title>
<link rel="stylesheet" href="style.css">
<style>
  .btn-nova-lista { background: #4f46e5; color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s; margin-bottom: 30px; }
  .btn-nova-lista:hover { background: #4338ca; }
  
  .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #333; }
  
  .lista-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.2s; }
  .lista-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
  
  .lista-header { background: #4f46e5; color: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
  .lista-card.concluida .lista-header { background: #818cf8; }
  
  .lista-body { padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-end; }
  .lista-info span { display: block; font-size: 0.75rem; color: #888; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
  .lista-info strong { font-size: 1.1rem; color: #111827; }
  
  .lista-actions { display: flex; gap: 10px; }
  .btn-outline { background: #fff; border: 1px solid #4f46e5; color: #4f46e5; padding: 6px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
  .btn-outline:hover { background: #eef2ff; }
  .btn-danger-outline { background: #fff; border: 1px solid #ef4444; color: #ef4444; padding: 6px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
  .btn-danger-outline:hover { background: #fef2f2; }
</style>
</head>
<body data-page="listas_compras">
<div class="app">
  <div id="menu"></div>
  <main class="main">
    <div class="topbar">
      <h1>Lista de Compras</h1>
      <div class="user-info"><strong id="userName">Carregando...</strong></div>
    </div>

    <button class="btn-nova-lista" onclick="abrirModalLista()">+ Nova Lista</button>

    <div class="section-title">Listas Pendentes</div>
    <div id="listasPendentes"></div>

    <div class="section-title" style="margin-top: 30px;">Listas Concluídas</div>
    <div id="listasConcluidas"></div>
  </main>
</div>

<!-- MODAL LISTA -->
<div class="modal-overlay" id="modalLista">
  <div class="modal-content" style="max-width: 400px;">
    <div class="modal-header">
      <h2 id="modalListaTitle">Nova Lista</h2>
      <button class="btn-close" onclick="closeModal('modalLista')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="listaForm">
        <input type="hidden" id="listaEditId">
        <div class="field"><label>Nome da Lista (Ex: Outubro)</label><input type="text" id="listaTitulo" required></div>
        <div class="field">
          <label>Categoria</label>
          <select id="listaCategoria" required>
            <option value="Mercado">Mercado</option>
            <option value="Farmácia">Farmácia</option>
            <option value="Construção">Construção</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px; background: #4f46e5;">Salvar Lista</button>
        <button type="button" class="btn-danger" id="btnExcluirLista" style="display: none; width: 100%; margin-top: 10px;" onclick="excluirListaDoModal()">Excluir Lista</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  let listas = [];

  async function carregarListas() {
    const { data, error } = await db.from('gestao_casal_listas_compras').select('*').eq('user_id', window.currentUser.id).order('created_at', { ascending: false });
    if (!error) {
      listas = data;
      
      // Busca a contagem de itens para cada lista
      for (let l of listas) {
        const { count } = await db.from('gestao_casal_itens_compra').select('*', { count: 'exact', head: true }).eq('lista_id', l.id);
        l._totalItens = count || 0;
      }
      
      renderListas();
    }
  }

  function renderListas() {
    const pendentes = listas.filter(l => !l.concluida);
    const concluidas = listas.filter(l => l.concluida);

    const divPend = document.getElementById('listasPendentes');
    if (pendentes.length === 0) divPend.innerHTML = '<p style="color: #666;">Nenhuma lista pendente.</p>';
    else divPend.innerHTML = pendentes.map(l => renderCard(l)).join('');

    const divConc = document.getElementById('listasConcluidas');
    if (concluidas.length === 0) divConc.innerHTML = '<p style="color: #666;">Nenhuma lista concluída.</p>';
    else divConc.innerHTML = concluidas.map(l => renderCard(l)).join('');
  }

  function renderCard(l) {
    return `
      <div class="lista-card ${l.concluida ? 'concluida' : ''}" onclick="window.location.href='lista_detalhe.html?id=${l.id}'">
        <div class="lista-header">
          🛒 ${l.titulo}
        </div>
        <div class="lista-body">
          <div class="lista-info">
            <span>Itens</span>
            <strong>${l._totalItens} itens</strong>
          </div>
          <div class="lista-info" style="text-align: right; margin-left: auto; margin-right: 20px;">
            <span>Categoria</span>
            <strong>${l.categoria}</strong>
          </div>
          <div class="lista-actions">
            <button class="btn-outline" onclick="event.stopPropagation(); abrirModalLista('${l.id}')">✏️ Editar</button>
            <button class="btn-danger-outline" onclick="event.stopPropagation(); excluirLista('${l.id}')">🗑️ Excluir</button>
          </div>
        </div>
      </div>
    `;
  }

  function abrirModalLista(id = null) {
    document.getElementById('listaForm').reset();
    document.getElementById('listaEditId').value = id || '';
    document.getElementById('modalListaTitle').textContent = id ? 'Editar Lista' : 'Nova Lista';
    document.getElementById('btnExcluirLista').style.display = id ? 'block' : 'none';

    if (id) {
      const l = listas.find(x => String(x.id) === String(id));
      if (l) {
        document.getElementById('listaTitulo').value = l.titulo;
        document.getElementById('listaCategoria').value = l.categoria;
      }
    }
    openModal('modalLista');
  }

  document.getElementById('listaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('listaEditId').value;
    const payload = {
      user_id: window.currentUser.id,
      titulo: document.getElementById('listaTitulo').value,
      categoria: document.getElementById('listaCategoria').value
    };

    let error;
    if (id) {
      const res = await db.from('gestao_casal_listas_compras').update(payload).eq('id', id);
      error = res.error;
    } else {
      const res = await db.from('gestao_casal_listas_compras').insert([payload]);
      error = res.error;
    }

    if (error) return alert("Erro: " + error.message);
    closeModal('modalLista');
    carregarListas();
  });

  async function excluirLista(id) {
    if (!confirm('Excluir esta lista apagará TODOS os itens. Continuar?')) return;
    await db.from('gestao_casal_listas_compras').delete().eq('id', id);
    carregarListas();
  }

  async function excluirListaDoModal() {
    const id = document.getElementById('listaEditId').value;
    if (!id || !confirm('Excluir esta lista?')) return;
    await db.from('gestao_casal_listas_compras').delete().eq('id', id);
    closeModal('modalLista');
    carregarListas();
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  document.addEventListener('DOMContentLoaded', () => {
    let tentativas = 0;
    const verificar = setInterval(() => {
      tentativas++;
      if (window.currentUser) {
        clearInterval(verificar);
        carregarListas();
      }
      if (tentativas > 25) clearInterval(verificar);
    }, 200);
  });
</script>
</body>
</html>
